<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musify - Pure Lossless Audio</title>
  <meta property="og:title" content="Musify - Pure Lossless Audio">
  <meta property="og:description" content="Listen to ad-free music with high-fidelity streaming on Musify.">
  <meta property="og:type" content="music.song">
  <meta name="theme-color" content="#1DB954">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #14221a 0%, #0a0a0f 60%, #050508 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #1DB954;
      border-radius: 50%;
      display: inline-block;
    }
    .artwork-container {
      width: 180px;
      height: 180px;
      margin: 0 auto 24px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(29, 185, 84, 0.25);
      background: #1a1a24;
      border: 1px solid rgba(29, 185, 84, 0.3);
    }
    .artwork {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    p.subtitle {
      color: #a0a0b0;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      margin-bottom: 12px;
      border: none;
    }
    .btn-primary {
      background: #1DB954;
      color: #000000;
      box-shadow: 0 8px 20px rgba(29, 185, 84, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #666680;
    }
    .footer-note a {
      color: #1DB954;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span>Musify</span>
      <span class="dot"></span>
    </div>

    <div class="artwork-container">
      <img id="track-art" class="artwork" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400" alt="Song Artwork">
    </div>

    <h1 id="track-title">Opening in Musify...</h1>
    <p id="track-subtitle" class="subtitle">Ad-Free Lossless Audio Experience</p>

    <a id="btn-open-app" class="btn btn-primary" href="#">▶ Open in Musify App</a>
    <a id="btn-web-player" class="btn btn-secondary" href="#">🎵 Play on YouTube Music</a>

    <div class="footer-note">
      Don't have Musify installed? <a href="https://github.com/mandanakakrish/Music-Player">Get APK on GitHub</a>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var videoId = params.get("v") || params.get("id");
      var title = params.get("title");
      var artist = params.get("artist");

      if (title) {
        document.getElementById("track-title").textContent = title;
      }
      if (artist) {
        document.getElementById("track-subtitle").textContent = artist + " • Musify";
      }

      if (videoId) {
        var artImg = document.getElementById("track-art");
        artImg.src = "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg";

        var intentUrl = "intent://watch?v=" + videoId + "#Intent;scheme=musify;package=com.gaminghub.musify;end";
        var schemeUrl = "musify://play?id=" + videoId;
        var ytUrl = "https://music.youtube.com/watch?v=" + videoId;

        document.getElementById("btn-open-app").href = intentUrl;
        document.getElementById("btn-web-player").href = ytUrl;

        // Auto-launch Musify App
        try {
          window.location.href = intentUrl;
        } catch(e) {}
      } else {
        document.getElementById("track-title").textContent = "Musify Music Player";
        document.getElementById("btn-open-app").href = "musify://home";
        document.getElementById("btn-web-player").style.display = "none";
      }
    })();
  </script>
</body>
</html>
